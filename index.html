
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUX CLOCK</title>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg,#111827,#303c52);
  background-size: cover;
  background-position: center;
  transition: background .3s;
}

.container {
  width: 90%;
  max-width: 390px;
  padding: 40px 20px;
  text-align: center;
  border-radius: 38px;
  border: 1px solid rgba(255,255,255,.4);
  background: rgba(255,255,255,.13);
  backdrop-filter: blur(30px) saturate(170%);
  -webkit-backdrop-filter: blur(30px) saturate(170%);
  box-shadow: 0 20px 60px #0006,
              inset 0 1px 2px #ffffff88;
}

.brand {
  letter-spacing: 7px;
  font-size: 12px;
  margin-bottom: 35px;
}

.date { margin-bottom: 15px; opacity: .9; }

.time {
  font-size: clamp(55px,15vw,80px);
  font-weight: 200;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
}

.seconds { font-size: 19px; opacity: .7; }

.day { font-size: 21px; margin-top: 15px; }

.line {
  height: 1px;
  width: 70%;
  margin: 28px auto;
  background: #ffffff99;
}

.footer {
  font-size: 10px;
  letter-spacing: 4px;
  opacity: .7;
}

.controls {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

button {
  border: 1px solid #ffffff66;
  border-radius: 30px;
  padding: 12px 18px;
  color: white;
  background: #ffffff20;
  font-size: 13px;
}

input { display: none; }
</style>
</head>

<body>

<div class="container">
  <div class="brand">FLUX CLOCK</div>
  <div class="date" id="date"></div>
  <div class="time">
    <span id="time"></span>
    <span class="seconds" id="seconds"></span>
  </div>
  <div class="day" id="day"></div>
  <div class="line"></div>
  <div class="footer">LIQUID GLASS EDITION</div>

  <div class="controls">
    <button onclick="document.getElementById('photo').click()">
      Choose Wallpaper
    </button>
    <button onclick="resetWallpaper()">Reset
    </button>
  </div>
  <input type="file" id="photo" accept="image/*">
</div>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("en-GB", {
      hour: "2-digit", minute: "2-digit",
      hour12: false
    });

  document.getElementById("seconds").textContent =
    now.toLocaleTimeString("en-GB", {
      second: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-IN", {
      day: "numeric", month: "long", year: "numeric"
    });

  document.getElementById("day").textContent =
    now.toLocaleDateString("en-IN", {weekday: "long"});
}

updateClock();
setInterval(updateClock,1000);

const photo = document.getElementById("photo");

photo.addEventListener("change", function() {
  const file = this.files[0];
  if (!file) return;

  if (!file.type.startsWith("image/")) {
    alert("Please choose an image");
    return;
  }

  const reader = new FileReader();
  reader.onload = function(e) {
    document.body.style.backgroundImage =
      `linear-gradient(#0004,#0004), url("${e.target.result}")`;
  };
  reader.readAsDataURL(file);
});

function resetWallpaper() {
  document.body.style.backgroundImage =
    "linear-gradient(135deg,#111827,#303c52)";
  photo.value = "";
}
</script>

</body>
</html>
