
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101521">
<title>FLUX CLOCK</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont,
    "SF Pro Display", Arial, sans-serif;
  color: white;

  background:
    radial-gradient(ellipse at 20% 15%, #526783 0%, transparent 45%),
    radial-gradient(ellipse at 85% 85%, #51486b 0%, transparent 45%),
    linear-gradient(145deg, #111a29, #080b13);
}

.container {
  width: 90%;
  max-width: 390px;
  padding: 35px 22px;
  border-radius: 38px;
  text-align: center;
  position: relative;
  overflow: hidden;

  background: linear-gradient(
    145deg,
    rgba(255,255,255,.24),
    rgba(255,255,255,.07)
  );

  border: 1px solid rgba(255,255,255,.38);

  backdrop-filter: blur(35px) saturate(180%);
  -webkit-backdrop-filter: blur(35px) saturate(180%);

  box-shadow:
    0 25px 80px rgba(0,0,0,.4),
    inset 0 1px 2px rgba(255,255,255,.65),
    inset 0 -1px 2px rgba(255,255,255,.15);
}

.container::before {
  content: "";
  position: absolute;
  width: 80%;
  height: 100px;
  top: -65px;
  left: 10%;
  background: rgba(255,255,255,.35);
  filter: blur(35px);
  border-radius: 50%;
  pointer-events: none;
}

.brand {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 7px;
  opacity: .8;
  margin-bottom: 35px;
}

.date {
  font-size: 16px;
  letter-spacing: 1px;
  color: rgba(255,255,255,.85);
  margin-bottom: 12px;
}

.time {
  font-size: clamp(58px, 15vw, 82px);
  font-weight: 200;
  letter-spacing: -4px;
  line-height: 1.1;
  text-shadow: 0 0 25px rgba(255,255,255,.25);
  font-variant-numeric: tabular-nums;
}

.seconds {
  font-size: 20px;
  font-weight: 300;
  opacity: .7;
  letter-spacing: 0;
}

.day {
  font-size: 21px;
  font-weight: 400;
  margin-top: 12px;
}

.line {
  width: 70%;
  height: 1px;
  margin: 28px auto;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.8),
    transparent
  );
}

.footer {
  font-size: 11px;
  letter-spacing: 4px;
  opacity: .65;
}

</style>
</head>

<body>

<div class="container">

  <div class="brand">FLUX CLOCK</div>

  <div class="date" id="date">Loading...</div>

  <div class="time">
    <span id="time">00:00</span>
    <span class="seconds" id="seconds">00</span>
  </div>

  <div class="day" id="day">Monday</div>

  <div class="line"></div>

  <div class="footer">LIQUID GLASS EDITION</div>

</div>

<script>
function updateClock() {
  const now = new Date();

  document.getElementById("time").textContent =
    now.toLocaleTimeString("en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    });

  document.getElementById("seconds").textContent =
    now.toLocaleTimeString("en-GB", {
      second: "2-digit"
    });

  document.getElementById("date").textContent =
    now.toLocaleDateString("en-IN", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

  document.getElementById("day").textContent =
    now.toLocaleDateString("en-IN", {
      weekday: "long"
    });
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
